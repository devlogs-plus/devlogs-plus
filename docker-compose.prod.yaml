services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devlogs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devlogs
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/devlogs-plus/devlogs-plus-backend:latest
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      DATABASE_URL: postgresql://devlogs:${POSTGRES_PASSWORD}@db:5432/devlogs
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
    depends_on:
      - db

  frontend:
    image: ghcr.io/devlogs-plus/devlogs-plus-frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
