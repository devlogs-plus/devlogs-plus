services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - HACKATIME_CLIENT_ID=${HACKATIME_CLIENT_ID}
      - HACKATIME_CLIENT_SECRET=${HACKATIME_CLIENT_SECRET}
      - HACKCLUB_CLIENT_ID=${HACKCLUB_CLIENT_ID}
      - HACKCLUB_CLIENT_SECRET=${HACKCLUB_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - WAKATIME_CLIENT_ID=${WAKATIME_CLIENT_ID}
      - WAKATIME_CLIENT_SECRET=${WAKATIME_CLIENT_SECRET}
      - CDN_KEY=${CDN_KEY}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # add VITE_ equivalents here once confirmed needed
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # no ports published — only backend talks to db, over the compose network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata: